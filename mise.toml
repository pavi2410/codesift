[tools]
rust = "latest"

[env]
RUST_BACKTRACE = "1"

[tasks.build-cli]
description = "Build the codesift CLI release binary"
sources = ["crates/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/codesift.exe", "target/release/codesift"]
run = "cargo build --release -p codesift-cli -q"

[tasks.cli]
description = "Run the codesift CLI (e.g. mise run cli index .)"
depends = ["build-cli"]
run = "./target/release/codesift"
run_windows = ".\\target\\release\\codesift.exe"
raw_args = true

[tasks.mcp]
description = "Start codesift MCP server (stdio) for Cursor, OpenCode, etc."
depends = ["build-cli"]
run = "./target/release/codesift --workspace . mcp"
run_windows = ".\\target\\release\\codesift.exe --workspace . mcp"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fix]
description = "Format and apply clippy fixes"
run = [
  "cargo fmt --all",
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
]

[tasks.build]
description = "Build workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Run tests"
run = "cargo test --workspace"

[tasks.check]
description = "Fmt check, clippy, test"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]
